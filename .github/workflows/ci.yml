name: Testes-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  teste-unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings -q
  imagem:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: docker build -t biblioteca-ci:latest .
      - run: docker run -d name biblioteca-ci -p 8000:8000 biblioteca-ci:latest
      - run: sleep 10 
      - run: curl -fsS http://localhost:8000/health; then exist 0
