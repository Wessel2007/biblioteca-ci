name: Testes-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  teste-unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --maxfail=1 --disable-warnings -q

  imagem:
    runs-on: ubuntu-latest
    needs: teste-unitarios
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t biblioteca-ci .
      - run: docker run -d --name biblioteca-ci -p 8000:8000 biblioteca-ci
      - run: curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8000/health