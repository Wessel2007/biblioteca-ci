name: Testes-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
jobs:
  teste-unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q
        run: ruff check . 